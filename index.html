<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f2f5f9">
  <title>Robotique — CSSBF | Maintenance</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; background: #f2f5f9; color: #18345b; display: grid; place-items: center; }
    main { width: min(100%, 510px); padding: clamp(35px, 7vw, 54px) clamp(24px, 6vw, 46px); background: #fff; border: 1px solid #dde5ef; border-radius: 15px; box-shadow: 0 12px 35px rgba(21,43,73,.045); text-align: center; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(25px, 5vw, 32px); line-height: 1.2; color: #163461; }
    .accent { width: 49px; height: 2px; margin: 20px auto 24px; background: #1699ac; }
    h2 { max-width: 340px; margin: 0 auto 15px; font-size: clamp(19px, 3.7vw, 22px); line-height: 1.35; }
    p { max-width: 400px; margin: 0 auto; color: #526887; font-size: 14px; line-height: 1.8; }
    footer { margin-top: 28px; font-size: 12px; color: #71829b; }
  </style>
</head>
<body>
  <main>
    <h1>Robotique · CSSBF</h1>
    <div class="accent" aria-hidden="true"></div>
    <h2>Site temporairement en maintenance</h2>
    <p>La plateforme de projets de robotique et de programmation est temporairement indisponible.</p>
    <footer>Merci de votre compréhension.</footer>
  </main>
</body>
</html>
